<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BAP Inventory | Barry Ave Plating Co.</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #090d16;
      color: #f8fafc;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-blue-600 selection:text-white">

  <!-- ==================== AUTHENTICATION SCREEN ==================== -->
  <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-[#090d16] to-[#090d16]">
    <div class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-2xl shadow-2xl p-8 backdrop-blur-sm">
      
      <!-- Brand Header -->
      <div class="flex flex-col items-center text-center mb-8">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-700 flex items-center justify-center shadow-lg shadow-blue-900/40 border border-blue-400/20 mb-4">
          <span class="text-2xl font-extrabold tracking-tight text-white">BAP</span>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-white">BAP Inventory</h1>
        <p class="text-sm font-medium text-slate-400 mt-1">Barry Ave Plating Co.</p>
        <p class="text-xs text-slate-500">Los Angeles, CA</p>
      </div>

      <!-- Auth Tabs -->
      <div class="grid grid-cols-2 gap-1 p-1 bg-slate-950 rounded-xl border border-slate-800 mb-6">
        <button id="tab-login" type="button" onclick="switchAuthTab('login')" class="py-2 text-sm font-medium rounded-lg bg-blue-600 text-white shadow transition">
          Sign In
        </button>
        <button id="tab-register" type="button" onclick="switchAuthTab('register')" class="py-2 text-sm font-medium rounded-lg text-slate-400 hover:text-white transition">
          Create Account
        </button>
      </div>

      <!-- Error / Status Alert -->
      <div id="auth-error" class="hidden mb-4 p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-medium"></div>
      <div id="auth-success" class="hidden mb-4 p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-medium"></div>

      <!-- Auth Form -->
      <form id="auth-form" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">Email Address</label>
          <input type="email" id="auth-email" required placeholder="operator@barryaveplating.com"
            class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">Password</label>
          <input type="password" id="auth-password" required minlength="6" placeholder="••••••••"
            class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition" />
        </div>
        <button type="submit" id="auth-submit-btn"
          class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm rounded-xl shadow-lg shadow-blue-900/30 transition flex items-center justify-center gap-2 mt-2">
          <span>Sign In to Dashboard</span>
        </button>
      </form>

      <div class="mt-6 pt-5 border-t border-slate-800/80 text-center">
        <p class="text-[11px] text-slate-500 flex items-center justify-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span>
          Cloud Sync Enabled across all devices
        </p>
      </div>
    </div>
  </div>

  <!-- ==================== MAIN APPLICATION ==================== -->
  <div id="app-screen" class="hidden min-h-screen flex flex-col">
    
    <!-- Top Navigation -->
    <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-700 flex items-center justify-center border border-blue-400/20 shadow">
            <span class="text-sm font-extrabold text-white">BAP</span>
